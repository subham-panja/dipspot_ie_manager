version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: tradepulse_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=trade_suite
    volumes:
      - mongo_data:/data/db
    networks:
      - tradepulse_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradepulse_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - FLASK_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/trade_suite
      - DATABASE_PATH=instance/leads.db
    depends_on:
      - mongodb
    volumes:
      - ./backend/instance:/app/instance
    networks:
      - tradepulse_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tradepulse_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - backend
    networks:
      - tradepulse_network

volumes:
  mongo_data:
    driver: local

networks:
  tradepulse_network:
    driver: bridge
